<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Should I Deploy Today? - Deployment Decision Tool</title>
    <link rel="icon" type="image/png" href="/orestislef_tr.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: #fbfbfd;
            color: #1d1d1f;
            min-height: 100vh;
            line-height: 1.47059;
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #000000;
                color: #f5f5f7;
            }
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            animation: fadeIn 0.8s cubic-bezier(0.28, 0.11, 0.32, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .deployment-box {
            max-width: 680px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 60px 50px;
            box-shadow: 2px 4px 24px rgba(0, 0, 0, 0.08);
            transition: all 0.45s cubic-bezier(0.28, 0.11, 0.32, 1);
        }

        @media (prefers-color-scheme: dark) {
            .deployment-box {
                background: #1d1d1f;
                box-shadow: 2px 4px 24px rgba(0, 0, 0, 0.5);
            }
        }

        .logo {
            font-size: clamp(40px, 5vw, 56px);
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
            letter-spacing: -0.009em;
            line-height: 1.0834933333;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            .logo {
                color: #f5f5f7;
            }
        }

        .subtitle {
            font-size: 19px;
            font-weight: 400;
            color: #6e6e73;
            margin-bottom: 48px;
            text-align: center;
            letter-spacing: 0.011em;
        }

        @media (prefers-color-scheme: dark) {
            .subtitle {
                color: #a1a1a6;
            }
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1d1d1f;
            font-size: 15px;
        }

        @media (prefers-color-scheme: dark) {
            label {
                color: #f5f5f7;
            }
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 17px;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #1d1d1f;
            transition: all 0.2s cubic-bezier(0.28, 0.11, 0.32, 1);
        }

        @media (prefers-color-scheme: dark) {
            select, input {
                background: #2d2d2f;
                border-color: #424245;
                color: #f5f5f7;
            }
        }

        select:focus, input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            select:focus, input:focus {
                border-color: #2997ff;
                box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.15);
            }
        }

        select option {
            background: #fff;
            color: #1d1d1f;
        }

        @media (prefers-color-scheme: dark) {
            select option {
                background: #2d2d2f;
                color: #f5f5f7;
            }
        }

        button {
            width: 100%;
            padding: 16px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s cubic-bezier(0.28, 0.11, 0.32, 1);
            box-shadow: 0 4px 16px rgba(0, 113, 227, 0.15);
        }

        button:hover {
            background: #0077ed;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 32px;
            padding: 32px;
            border-radius: 18px;
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.28, 0.11, 0.32, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.success {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid rgba(52, 199, 89, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            .result.success {
                background: rgba(52, 199, 89, 0.15);
                border-color: rgba(52, 199, 89, 0.4);
            }
        }

        .result.danger {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            .result.danger {
                background: rgba(255, 59, 48, 0.15);
                border-color: rgba(255, 59, 48, 0.4);
            }
        }

        .result h3 {
            margin: 0 0 12px 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.003em;
        }

        .result.success h3 {
            color: #34c759;
        }

        .result.danger h3 {
            color: #ff3b30;
        }

        .result .message {
            font-size: 17px;
            margin-bottom: 16px;
            color: #1d1d1f;
            line-height: 1.47059;
        }

        @media (prefers-color-scheme: dark) {
            .result .message {
                color: #f5f5f7;
            }
        }

        .result .details {
            font-size: 14px;
            color: #6e6e73;
            padding: 16px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            .result .details {
                color: #a1a1a6;
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .loading {
            text-align: center;
            color: #0071e3;
            display: none;
            margin-top: 32px;
            font-size: 17px;
        }

        @media (prefers-color-scheme: dark) {
            .loading {
                color: #2997ff;
            }
        }

        .loading p {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .examples {
            margin-top: 48px;
            padding: 32px;
            background: rgba(0, 113, 227, 0.05);
            border: 1px solid rgba(0, 113, 227, 0.2);
            border-radius: 18px;
        }

        @media (prefers-color-scheme: dark) {
            .examples {
                background: rgba(41, 151, 255, 0.08);
                border-color: rgba(41, 151, 255, 0.3);
            }
        }

        .examples h3 {
            margin: 0 0 16px 0;
            color: #0071e3;
            font-size: 21px;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            .examples h3 {
                color: #2997ff;
            }
        }

        .examples ul {
            margin: 0;
            padding-left: 20px;
        }

        .examples li {
            margin-bottom: 10px;
            color: #1d1d1f;
        }

        @media (prefers-color-scheme: dark) {
            .examples li {
                color: #f5f5f7;
            }
        }

        .examples a {
            color: #0071e3;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        @media (prefers-color-scheme: dark) {
            .examples a {
                color: #2997ff;
            }
        }

        .examples a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
                align-items: flex-start;
            }

            .deployment-box {
                padding: 40px 30px;
            }

            .logo {
                font-size: 36px;
            }

            .subtitle {
                font-size: 17px;
                margin-bottom: 36px;
            }
        }

        @media (max-width: 480px) {
            .deployment-box {
                padding: 32px 24px;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="deployment-box">
            <h1 class="logo">Should I Deploy?</h1>
            <p class="subtitle">Make informed deployment decisions</p>

            <form id="deployForm">
                <div class="form-group">
                    <label for="language">Language / Γλώσσα</label>
                    <select id="language" name="lang">
                        <option value="en">English</option>
                        <option value="el">Ελληνικά (Greek)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <select id="timezone" name="tz">
                        <option value="UTC">UTC</option>
                        <option value="Europe/Athens">Europe/Athens</option>
                        <option value="America/New_York">America/New_York</option>
                        <option value="America/Los_Angeles">America/Los_Angeles</option>
                        <option value="Europe/London">Europe/London</option>
                        <option value="Europe/Paris">Europe/Paris</option>
                        <option value="Asia/Tokyo">Asia/Tokyo</option>
                        <option value="Australia/Sydney">Australia/Sydney</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="customDate">Custom Date (optional)</label>
                    <input type="date" id="customDate" name="date">
                </div>

                <button type="submit">Check Deployment Status</button>
            </form>

            <div class="loading" id="loading">
                <p>Checking deployment status...</p>
            </div>

            <div class="result" id="result">
                <h3 id="resultTitle"></h3>
                <div class="message" id="resultMessage"></div>
                <div class="details" id="resultDetails"></div>
            </div>

            <div class="examples">
                <h3>Direct API Access</h3>
                <ul>
                    <li><a href="https://orestislef.gr/shouldideploy/api.php" target="_blank">Default (English, UTC)</a></li>
                    <li><a href="https://orestislef.gr/shouldideploy/api.php?lang=el" target="_blank">Greek language</a></li>
                    <li><a href="https://orestislef.gr/shouldideploy/api.php?lang=el&tz=Europe/Athens" target="_blank">Greek + Athens timezone</a></li>
                    <li><a href="https://orestislef.gr/shouldideploy/api.php?date=2024-12-25&lang=el" target="_blank">Christmas Day in Greek</a></li>
                    <li><a href="https://orestislef.gr/shouldideploy/api.php?date=2024-12-06&lang=en" target="_blank">Friday the 6th (English)</a></li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Deploy form functionality
        document.getElementById('deployForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(e.target);
            const params = new URLSearchParams();

            for (let [key, value] of formData.entries()) {
                if (value) params.append(key, value);
            }

            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            // Show loading, hide result
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const response = await fetch(`https://orestislef.gr/shouldideploy/api.php?${params.toString()}`);
                const data = await response.json();

                // Hide loading
                loading.style.display = 'none';

                if (data.error) {
                    showResult('Error', data.error.message, '', 'danger');
                } else {
                    const title = data.shouldideploy ? 'Deploy Authorized' : 'Deploy Not Recommended';
                    const cssClass = data.shouldideploy ? 'success' : 'danger';
                    const details = `
                        <strong>Timezone:</strong> ${data.timezone}<br>
                        <strong>Date:</strong> ${new Date(data.date).toLocaleString()}<br>
                        <strong>Status:</strong> ${data.shouldideploy ? 'Authorized' : 'Not Recommended'}
                    `;

                    showResult(title, data.message, details, cssClass);
                }
            } catch (error) {
                loading.style.display = 'none';
                showResult('Connection Failed', 'Unable to connect to deployment service', error.message, 'danger');
            }
        });

        function showResult(title, message, details, cssClass) {
            const result = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const resultDetails = document.getElementById('resultDetails');

            resultTitle.textContent = title;
            resultMessage.textContent = message;
            resultDetails.innerHTML = details;

            result.className = `result ${cssClass}`;
            result.style.display = 'block';

            // Scroll to result
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Set current date as default
        document.getElementById('customDate').valueAsDate = new Date();
    </script>
</body>
</html>
